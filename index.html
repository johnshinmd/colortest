<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Spectrum</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#202b30;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font:clamp(36px,7vw,64px)/1.1 Georgia,serif;letter-spacing:-2px}h2{font:32px Georgia,serif}button{font:inherit;cursor:pointer;border:1px solid #c9cecb;border-radius:12px;padding:10px 17px;background:white;color:inherit}button:disabled{opacity:.4;cursor:default}.primary{background:#203b35;color:white;border:0}.panel{background:white;border:1px solid #e2e0d9;border-radius:24px;padding:clamp(18px,4vw,36px);margin:22px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:18px;border:2px solid transparent;border-radius:16px;background:#f5f5f2;min-height:120px}.tile.selected{border-color:#203b35}.rank{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.rank button{padding:5px 12px}.rank .on{background:#203b35;color:white}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.track{height:6px;background:#e0e3de;border-radius:8px;overflow:hidden}.track i{display:block;height:100%;background:#527e69;transition:width .2s}.bar{height:12px;border-radius:10px;background:#eee;overflow:hidden}.bar i{display:block;height:100%;border-radius:10px}.muted{color:#65716e;font-size:14px}.symbol{font-size:42px;letter-spacing:8px}.swatch{height:8px;border-radius:8px;margin-bottom:16px}details{margin:12px 0;border-bottom:1px solid #ddd;padding:12px 0}summary{cursor:pointer;font-weight:600}@media(max-width:480px){main{padding:15px}.tile{padding:12px}.rank button{padding:5px 9px}}@media print{header,.nav,button{display:none}}</style><main><header><strong>◉ COLOR SPECTRUM</strong><button id="lang" onclick="toggle()">한국어</button></header><div id="app"><div class="pan let L=0,s=0,a=Array.from({length:7},()=>[0,0,0,0]);const t=(e,k)=>L?k:e;function toggle(){L=1-L;document.documentElement.lang=L?'ko':'en';render()}function choose(i,n){let r=a[s-1],j=r.indexOf(n);if(j===i)r[i]=0;else{if(j>=0)r[j]=r[i];r[i]=n}render()}function go(n){s=n;render();window.scrollTo(0,0)}function reset(){a=Array.from({length:7},()=>[0,0,0,0]);go(0)}function render(){document.getElementById('lang').textContent=L?'English':'한국어';let h='';if(s===0){h=`<div class="panel"><div class="muted">${t('A SELF-REFLECTION EXPERIENCE','자기 이해를 위한 경험')}</div><h1>${t('Discover your colors.','나만의 컬러를 발견하세요.')}</h1><p>${t('Four colors. One unique spectrum. Explore what motivates you, how you work and how you connect with others.','네 가지 컬러, 하나뿐인 나의 스펙트럼. 나의 동기와 업무 방식, 관계를 탐색해 보세요.')}</p><div style="display:flex;gap:8px">${C.map(c=>`<div style="height:60px;flex:1;background:${c};border-radius:12px"></div>`).join('')}</div><p class="muted">${t('7 short ranking activities · No account required · Answers stay in this page','7단계 순위 선택 · 가입 불필요 · 답변은 이 페이지에만 유지')}</p><button class="primary" onclick="go(1)">${t('Begin assessment','시작하기')} →</button></div>`}else if(s<=7){let r=a[s-1];h=`<p class="muted">${s} / 7</p><div class="track"><i style="width:${s/7*100}%"></i></div><div class="panel"><h2>${s===1?t('Visual impressions','이미지 첫인상'):s===2?t('Which description feels like you?','어떤 설명이 나와 가장 비슷한가요?'):t('Word clusters','단어 그룹')+' '+(s-2)+'/5'}</h2><p>${t('Rank each option from 4 (most like you) to 1 (least like you). Use each number once.','나와 가장 비슷한 항목은 4점, 가장 다른 항목은 1점으로 선택하세요. 각 숫자는 한 번씩 사용합니다.')}</p><div class="grid">${C.map((c,i)=>`<div class="tile ${r[i]?'selected':''}">${s<=2?`<div class="swatch" style="background:${c}"></div>`:''}${s===1?`<div class="symbol">${cards[0][i]}</div>`:s===2?`<strong>${names[L][i]}</strong><p>${profiles[L][i][0]}</p><details><summary>${t('More about this color','자세히 보기')}</summary>${profiles[L][i].slice(1,4).map(x=>`<p>${x}</p>`).join('')}</details>`:(L?ko:words)[s-3][i]}<div class="rank">${[4,3,2,1].map(n=>`<button class="${r[i]===n?'on':''}" onclick="choose(${i},${n})" aria-pressed="${r[i]===n}">${n}</button>`).join('')}</div></div>`).join('')}</div><div class="nav"><button onclick="go(${s-1})">${t('Back','이전')}</button><button class="primary" ${r.every(Boolean)?'':'disabled'} onclick="go(${s+1})">${s===7?t('See results','결과 보기'):t('Continue','다음')} →</button></div></div>`}else{let scores=C.map((_,i)=>a.slice(1).reduce((v,r)=>v+r[i],0)),order=[0,1,2,3].sort((i,j)=>scores[j]-scores[i]||a[1][j]-a[1][i]),p=order[0];h=`<div class="panel"><div class="muted">${t('YOUR PERSONAL SPECTRUM','나의 컬러 스펙트럼')}</div><h1 style="color:${C[p]}">${names[L][p]}</h1><h2>${titles[L][p]}</h2><p>${profiles[L][p][0]}</p>${order.map((i,k)=>`<p><strong>${names[L][i]}</strong> · ${[t('Brightest','주 컬러'),t('Secondary','두 번째'),t('Third','세 번째'),t('Palest','네 번째')][k]} <span style="float:right">${scores[i]} / 24</span></p><div class="bar"><i style="width:${scores[i]/24*100}%;background:${C[i]}"></i></div>`).join('')}<p class="muted">${t('Scores reflect relative preferences, not ability. Ties are resolved by the description ranking.','점수는 능력이 아닌 상대적인 선호를 나타냅니다. 동점은 설명 카드 순위로 결정합니다.')}</p></div><div class="panel"><h2>${t('Explore your colors','나의 컬러 이해하기')}</h2>${order.map((i,k)=>`<details ${k===0?'open':''}><summary style="color:${C[i]}">${names[L][i]} — ${titles[L][i]}</summary>${profiles[L][i].map((x,j)=>`<p><strong>${(L?['핵심 성향','업무','관계','어린 시절','가치','성장 방향']:['Core preferences','At work','In relationships','In childhood','Values','Growth opportunity'])[j]}</strong><br>${x}</p>`).join('')}</details>`).join('')}<div class="nav"><button onclick="reset()">${t('Start over','다시 시작')}</button><button class="primary" onclick="window.print()">${t('Print / Save PDF','인쇄 / PDF 저장')}</button></div></div>`}document.getElementById('app').innerHTML=h+`<p class="muted">${t('Unofficial adaptation of the True Colors® framework for personal reflection.
